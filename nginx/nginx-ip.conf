user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 768;
}

http {

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 0;
    client_body_buffer_size 128k;
    proxy_request_buffering on;
    client_body_temp_path /var/lib/nginx/body_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Loggings
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip
    gzip on;

    # Hide nginx version in headers / error pages
    server_tokens off;

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;

    # Bare-IP (HTTP) mode: the admin UI and API are served from http://<SYSTEM_IP>.
    # CORS allows any http://<ipv4>[:port] origin without editing.
    #
    # Tenant login needs a hostname: the backend reads the org database name from
    # the 2nd label of the browser host (default.<org>.<domain>), so a bare IP
    # fails. Point default.<org>.<domain> at this VM (DNS or hosts file), set
    # DOMAIN_URL / TENANT_BASE_DOMAIN to match in .env, and add it below.
    map $http_origin $cors_origin {
        default "";
        "~^http://[0-9]{1,3}(\.[0-9]{1,3}){3}(:[0-9]+)?$" $http_origin;
        # CUSTOMER: uncomment and set your tenant site
        # "http://default.<org>.<domain>"  $http_origin;
    }

    # -------------------------------------------------------------------------
    # Upstreams — consolidated stack.
    # Upstream names are kept from the reference config so the location blocks
    # below stay the same. Modules that were merged into authnull-service all
    # point at :8080. 127.0.0.1 is used instead of "localhost" because the
    # containers are bound to IPv4 loopback only (localhost may resolve to ::1).
    # Removed (no such service in this stack): onprem_dbconsole, onprem_minio.
    # -------------------------------------------------------------------------
    # did-react (admin UI)
    upstream onprem_frontend {
        server 127.0.0.1:5173;
    }
    # self-service-console
    upstream onprem_ssc {
        server 127.0.0.1:3000;
    }
    # authnull-service (mfa module, was :8085)
    upstream onprem_mfa {
        server 127.0.0.1:8080;
    }
    # authn-service
    upstream onprem_authn {
        server 127.0.0.1:2882;
    }
    # authnull-service (pam module, was :9090)
    upstream onprem_pam {
        server 127.0.0.1:8080;
    }
    # authnull-service (was :6062)
    upstream onprem_verifier {
        server 127.0.0.1:8080;
    }
    # authnull-service (was :9234)
    upstream onprem_database {
        server 127.0.0.1:8080;
    }
    # authnull-service (ad module, was :6064)
    upstream onprem_ad {
        server 127.0.0.1:8080;
    }
    # log-service
    upstream onprem_log {
        server 127.0.0.1:9255;
    }
    # secret-management-service
    upstream onprem_secret {
        server 127.0.0.1:9291;
    }
    # authnull-service (was :9211)
    upstream onprem_dashboard {
        server 127.0.0.1:8080;
    }
    # authnull-service (was :6061)
    upstream onprem_wallet {
        server 127.0.0.1:8080;
    }
    # blockchain-ipfs-logging
    upstream onprem_blockchain {
        server 127.0.0.1:6065;
    }
    # authnull-service (okta module, was :6067)
    upstream onprem_okta {
        server 127.0.0.1:8080;
    }
    # authnull-service (policy module, was :7079)
    upstream onprem_policy {
        server 127.0.0.1:8080;
    }
    # authnull-service (was :2000)
    upstream onprem_service_accounts {
        server 127.0.0.1:8080;
    }
    # authnull-service (was :6090)
    upstream onprem_entra {
        server 127.0.0.1:8080;
    }
    # authnull-service (user module, was :8000)
    upstream onprem_user {
        server 127.0.0.1:8080;
    }
    # authnull-service (issuer module, was :6060)
    upstream onprem_issuer {
        server 127.0.0.1:8080;
    }
    # authnz
    upstream onprem_authnz {
        server 127.0.0.1:6066;
    }

    ##########################################################################
    # Main application on the bare IP, plain HTTP (no domain, no certificate)
    ##########################################################################

    server {
        listen 80 default_server;
        server_name _;

        client_max_body_size 50m;
        proxy_connect_timeout 300;
        proxy_read_timeout 300;
        proxy_send_timeout 60;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Only the API path, as in the tenant server of nginx.conf: other /pam/*
        # paths (e.g. /pam/directory) are admin UI routes and fall to location /.
        location /pam/api/v1/ {
            proxy_pass http://onprem_pam;
            proxy_http_version 1.1;
            # proxy_set_header here replaces the server-level ones, so repeat them all
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Origin, X-Requested-With, Content-Type, Accept, Content-Length, Accept-Encoding, X-CSRF-Token, Cache-Control, X-Authorization, withCredentials, X-Requesturl, X-User-Ip, Userid, email' always;
            if ($request_method = OPTIONS) { return 204; }
        }
        location /api/v1/verifierService/ {
            proxy_pass http://onprem_verifier/api/v1/verifierService/;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Origin, X-Requested-With, Content-Type, Accept, Content-Length, Accept-Encoding, X-CSRF-Token, Cache-Control, X-Authorization, withCredentials, X-Requesturl, X-User-Ip, Userid, email' always;
            if ($request_method = OPTIONS) { return 204; }
        }
        # Database web console. did-react calls ${REACT_APP_API_URL}/console/{init,ws}
        # (REACT_APP_API_URL = SYSTEM_URL, no /api/v1); authnull-service serves them
        # at /api/v1/dbconsole/*. Without these, both fell to location / (the UI dev
        # server): init got index.html with a 200 and the WebSocket closed with 1006.
        location = /console/init {
            proxy_pass http://onprem_database/api/v1/dbconsole/init;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Origin, X-Requested-With, Content-Type, Accept, Content-Length, Accept-Encoding, X-CSRF-Token, Cache-Control, X-Authorization, withCredentials, X-Requesturl, X-User-Ip, Userid, email' always;
            if ($request_method = OPTIONS) { return 204; }
        }
        location = /console/ws {
            proxy_pass http://onprem_database/api/v1/dbconsole/ws;
            proxy_http_version 1.1;
            # proxy_set_header here replaces the server-level ones, so repeat them all
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # An idle SQL session must not be cut at the 300s server default.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
        location /api/v1/databaseService/ {
            proxy_pass http://onprem_database/api/v1/databaseService/;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Origin, X-Requested-With, Content-Type, Accept, Content-Length, Accept-Encoding, X-CSRF-Token, Cache-Control, X-Authorization, withCredentials, X-Requesturl, X-User-Ip, Userid, email' always;
            if ($request_method = OPTIONS) { return 204; }
