##########################################################################
# AuthNull on-prem: /etc/nginx/nginx.conf  (DOMAIN + HTTPS mode)
#
# For a bare-IP install without DNS or certificates, use nginx-ip.conf.
#
# Before use, replace the two placeholders with your values. They must
# match .env (SYSTEM_URL, DOMAIN_URL, TENANT_BASE_DOMAIN):
#   onprem.example.com         main site     -> SYSTEM_URL host
#   default.<org>.example.com  tenant site   -> DOMAIN_URL, <org> = ORG_NAME
# e.g.  sed -e 's/<org>/acme/g' -e 's/example\.com/mycorp.com/g' \
#         nginx/nginx.conf | sudo tee /etc/nginx/nginx.conf > /dev/null
#
# Requirements on the VM:
#   - DNS A records for both hostnames pointing at this VM's public IP
#   - inbound TCP 80 and 443 open (cloud firewall / security group)
#   - certificates, issued while nginx is running:
#       sudo certbot certonly --nginx -d onprem.example.com
#       sudo certbot certonly --nginx -d default.<org>.example.com
#
# nginx runs on the same VM as the docker compose "onprem" stack, so every
# upstream is 127.0.0.1 (not "localhost", which may resolve to ::1).
# All authnull-service modules (ad, dashboard, database, dbconsole, entra,
# issuer, mfa, okta, pam, policy, user, verifier, wallet) are on :8080.
# Apply:  sudo nginx -t && sudo systemctl reload nginx
##########################################################################

user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 768;
}

http {

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Only the AuthNull sites may make credentialed cross-origin calls.
    map $http_origin $cors_origin {
        default "";
        "https://onprem.example.com"           "https://onprem.example.com";
        "https://default.<org>.example.com"    "https://default.<org>.example.com";
        # any other tenant site default.*.example.com (dots in the domain are
        # left unescaped so the sed in the header rewrites this line too)
        "~^https://default\.[a-z0-9-]+\.example.com$" $http_origin;
    }

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 0;
    client_body_buffer_size 128k;
    proxy_request_buffering on;
    client_body_temp_path /var/lib/nginx/body_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    gzip on;
    server_tokens off;

    # sites-enabled is deliberately not included: the stock "default" site
    # also claims default_server on :80 and would make nginx -t fail.
    include /etc/nginx/conf.d/*.conf;

    ##########################################################################
    # Upstreams — one per running container
    ##########################################################################
    # did-react (admin UI; container :3000 published on host :5173)
    upstream onprem_frontend {
        server 127.0.0.1:5173;
    }
    # self-service-console
    upstream onprem_ssc {
        server 127.0.0.1:3000;
    }
    # authn-service
    upstream onprem_authn {
        server 127.0.0.1:2882;
    }
    # authnull-service: ad, dashboard, database, dbconsole, entra, issuer, mfa, okta, pam, policy, user, verifier, wallet
    upstream onprem_authnull_service {
        server 127.0.0.1:8080;
    }
    # log-service
    upstream onprem_log {
        server 127.0.0.1:9255;
    }
    # secret-management-service
    upstream onprem_secret {
        server 127.0.0.1:9291;
    }
    # authnz
    upstream onprem_authnz {
        server 127.0.0.1:6066;
    }

    ##########################################################################
    # Catch-all: requests to the bare IP (http(s)://<vm-ip>) or any
    # unknown hostname get no site, so scanners can't load the admin UI.
    # Let's Encrypt renewals still work: they use the real hostnames below.
    ##########################################################################
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }
    server {
        listen 443 ssl default_server;
        server_name _;
        ssl_reject_handshake on;
    }

    ##########################################################################
    # Main application - onprem.example.com
    ##########################################################################

    server {
        listen 80;
        server_name onprem.example.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name onprem.example.com;
        ssl_certificate /etc/letsencrypt/live/onprem.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/onprem.example.com/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        client_max_body_size 50m;
        proxy_connect_timeout 300;
        proxy_read_timeout 300;
        proxy_send_timeout 60;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Web Console - authnull-service dbconsole module (init + WebSocket)
        location /console/ {
            proxy_pass http://onprem_authnull_service/api/v1/dbconsole/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Origin, X-Requested-With, Content-Type, Accept, Content-Length, Accept-Encoding, X-CSRF-Token, Cache-Control, X-Authorization, withCredentials, X-Requesturl, X-User-Ip, Userid, email' always;
            if ($request_method = OPTIONS) { return 204; }
        }
        location /pam/ {
            proxy_pass http://onprem_authnull_service;
            proxy_http_version 1.1;
            # proxy_set_header here replaces the server-level ones, so repeat them all
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Origin, X-Requested-With, Content-Type, Accept, Content-Length, Accept-Encoding, X-CSRF-Token, Cache-Control, X-Authorization, withCredentials, X-Requesturl, X-User-Ip, Userid, email' always;
            if ($request_method = OPTIONS) { return 204; }
